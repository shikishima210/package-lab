<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>パッケージ展開図ラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: modeling workbench — outliner | 3D stage over cutting-mat dieline sheet | properties */
:root{
  /* palette: base #F4F4F4 (70%) / main #145591 (25%) / accent #CBC8C4 (5%) */
  --bg:#ebe9e6; --panel:#f4f4f4; --ink:#1b2a3a; --muted:#5f6973; --line:#d9d6d2; --hover:#e8e6e3;
  --field:#ffffff; --accent:#145591; --accent-ink:#ffffff; --accent-soft:#dde7f1; --grey:#cbc8c4; --fold:#d6352b;
  --warn:#8f4d0b; --warn-bg:#f8eee2; --ok:#145591; --ok-bg:#e4ecf4; --sel:#ffc928;
  --stage:#dedbd6; --floor:#cdc9c3; --floor-line:rgba(20,85,145,.07); --floor-major:rgba(20,85,145,.16);
  --mat:#145591; --mat-line:rgba(255,255,255,.08); --mat-major:rgba(255,255,255,.2); --mat-ink:rgba(255,255,255,.88); --cut:#0e2c4c;
  --shadow:0 1px 2px rgba(20,40,60,.06),0 6px 18px rgba(20,40,60,.08);
  --font-ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1319; --panel:#141a21; --ink:#e6e9ec; --muted:#9aa3ad; --line:#28303a; --hover:#1d252e;
  --field:#0f141a; --accent:#6ea2d4; --accent-ink:#08121c; --accent-soft:#1a2d42; --grey:#5b5854; --fold:#ff7466;
  --warn:#f2b46a; --warn-bg:#2c2215; --ok:#8fc0ea; --ok-bg:#15283b; --sel:#ffd34d;
  --stage:#161c23; --floor:#1b2129; --floor-line:rgba(255,255,255,.05); --floor-major:rgba(255,255,255,.11);
  --mat:#0e365e; --mat-line:rgba(255,255,255,.06); --mat-major:rgba(255,255,255,.14); --mat-ink:rgba(255,255,255,.8); --cut:#0e2c4c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1319; --panel:#141a21; --ink:#e6e9ec; --muted:#9aa3ad; --line:#28303a; --hover:#1d252e;
  --field:#0f141a; --accent:#6ea2d4; --accent-ink:#08121c; --accent-soft:#1a2d42; --grey:#5b5854; --fold:#ff7466;
  --warn:#f2b46a; --warn-bg:#2c2215; --ok:#8fc0ea; --ok-bg:#15283b; --sel:#ffd34d;
  --stage:#161c23; --floor:#1b2129; --floor-line:rgba(255,255,255,.05); --floor-major:rgba(255,255,255,.11);
  --mat:#0e365e; --mat-line:rgba(255,255,255,.06); --mat-major:rgba(255,255,255,.14); --mat-ink:rgba(255,255,255,.8); --cut:#0e2c4c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3);
  color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:13.5px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:250px minmax(0,1fr) 300px;height:100%}
.left,.right{overflow-y:auto;background:var(--panel);padding-block:14px 24px;padding-inline:16px;min-width:0}
.left{border-right:1px solid var(--line)}
.right{border-left:1px solid var(--line)}
main{display:grid;grid-template-rows:minmax(0,1.2fr) minmax(0,1fr);min-width:0;min-height:0}

.brand{display:flex;gap:10px;align-items:flex-start}
.brand .mark{flex:none;width:22px;height:22px;margin-top:2px;border-radius:5px;background:linear-gradient(90deg,var(--accent) 0 72%,var(--grey) 72%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.brand h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.02em}
.brand p{color:var(--muted);font-size:12px;margin:2px 0 12px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.12em;margin:14px 0 8px}
.hd:first-child{margin-top:0}

/* add menu */
.addmenu{position:relative}
.addmenu summary{list-style:none;cursor:pointer;font-size:12px;letter-spacing:0;font-weight:500;color:var(--accent);border:1px solid var(--line);background:var(--field);border-radius:6px;padding:2px 9px}
.addmenu summary::-webkit-details-marker{display:none}
.addmenu .menu{max-height:min(70vh,560px);overflow-y:auto;position:absolute;right:0;top:calc(100% + 4px);z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 30px rgba(10,20,40,.18);padding:6px;width:236px;letter-spacing:0;font-weight:400;color:var(--ink)}
.menu .grp{font-size:10.5px;color:var(--muted);padding:6px 8px 2px;letter-spacing:.1em}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px}
.menu button small{display:block;color:var(--muted);font-size:11px}
.menu button:hover{background:var(--hover)}

/* outliner */
.tree{display:grid;gap:1px}
.ti{display:flex;align-items:center;gap:6px;border:0;background:none;text-align:left;padding:5px 6px;border-radius:6px;cursor:pointer;width:100%;font-size:13px;min-height:30px}
.ti:hover{background:var(--hover)}
.ti[aria-current="true"]{background:var(--accent-soft);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.ti .ty{font-family:var(--font-num);font-size:10px;color:var(--muted);border:1px solid var(--grey);border-radius:4px;padding:0 4px;flex:none}
.ti .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ti .dm{font-family:var(--font-num);font-size:10.5px;color:var(--muted);flex:none}
.ti.l1{padding-left:22px}
.ti.l2{padding-left:38px;font-size:12.5px;color:var(--muted)}
.ti.l2[aria-current="true"]{color:var(--ink)}
.trow{display:flex;align-items:center;gap:2px}
.trow .ti{flex:1;min-width:0}
.tdel{flex:none;width:28px;height:28px;border:0;border-radius:6px;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0;opacity:.55}
.tdel svg{width:15px;height:15px}
.trow:hover .tdel,.tdel:focus-visible{opacity:1}
.tdel:hover{color:var(--fold);background:var(--hover)}
.tdel.armed{opacity:1;background:var(--fold);color:#fff}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.2);flex:none}

.notes{display:grid;gap:6px}
.note{font-size:12px;padding:6px 9px;border-radius:6px;border-left:3px solid var(--warn);background:var(--warn-bg)}
.note.ok{border-left-color:var(--ok);background:var(--ok-bg)}
.hint{font-size:11.5px;color:var(--muted);margin:4px 0 10px}

/* properties */
.ptitle{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.ptitle input{font-size:15px;font-weight:700;border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 6px;width:100%;min-width:0}
.ptitle input:hover,.ptitle input:focus{border-color:var(--line);background:var(--field)}
.psub{font-size:12px;color:var(--muted);margin:0 0 6px 6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.f{display:grid;gap:3px;font-size:11.5px;color:var(--muted);min-width:0}
.num{display:flex;align-items:center;border:1px solid var(--line);background:var(--field);border-radius:6px;padding-inline:6px;height:30px;min-width:0}
.num input{width:100%;border:0;background:transparent;font-family:var(--font-num);font-size:12.5px;text-align:right;padding:0;min-width:0;color:var(--ink);font-variant-numeric:tabular-nums}
.num input:focus{outline:none}
.num:focus-within{border-color:var(--accent)}
.num span{font-family:var(--font-num);font-size:10px;color:var(--muted);margin-left:3px}
.num input:disabled{color:var(--muted)}
select,.txt{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--field);padding-inline:7px;width:100%;color:var(--ink);font-size:13px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer;color:var(--ink)}
.check input{accent-color:var(--accent);margin-top:3px}
.seg{display:inline-grid;grid-auto-flow:column;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--field)}
.seg button{border:0;background:transparent;padding:3px 11px;font-size:12.5px;cursor:pointer;min-height:30px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.rowx{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.swatches{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.sw{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
input[type=color]{width:28px;height:28px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--field);cursor:pointer}
.colorrow{display:grid;grid-template-columns:40px minmax(0,1fr) 28px;gap:8px;align-items:center;font-size:12.5px}
.cmyk{display:grid;gap:6px}
.grid4{display:grid;gap:6px}
.prm{grid-column:1/-1;display:grid;grid-template-columns:84px 78px minmax(0,1fr);gap:8px;align-items:center;font-size:11.5px;color:var(--muted)}
.prm>label{text-align:right;line-height:1.25}
.prm .num{height:28px}
.prs{-webkit-appearance:none;appearance:none;width:100%;height:22px;margin:0;background:transparent;cursor:pointer;--fill:var(--accent);--p:0%}
.prs::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--fill) var(--p),var(--line) var(--p))}
.prs::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--fill) var(--p),var(--line) var(--p))}
.prs::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:var(--field);border:2px solid var(--fill);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.prs::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--field);border:2px solid var(--fill)}
.prs:disabled{opacity:.35;cursor:default}
.prs.ch0{--fill:#00a0e9}.prs.ch1{--fill:#e4007f}.prs.ch2{--fill:#e8b900}.prs.ch3{--fill:var(--ink)}
.chip{width:28px;height:28px;border-radius:6px;border:1px solid var(--line)}
.stack{display:grid;gap:10px}
.btn{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:12.5px;min-height:32px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 86%,#000)}
.btn.danger{color:var(--fold)}
.btn.danger.armed{background:var(--fold);color:#fff;border-color:var(--fold)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.addgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.addgrid .btn{text-align:left}
.plist{display:grid;gap:2px}
.empty{color:var(--muted);font-size:12.5px;padding:8px 0}
.imgprev{border:1px solid var(--line);border-radius:8px;padding:8px;display:grid;place-items:center;background:repeating-conic-gradient(var(--hover) 0 25%,var(--field) 0 50%) 0 0/14px 14px}
.imgprev img{max-height:120px;object-fit:contain;display:block}

/* stages */
.stage{position:relative;min-height:0;min-width:0;overflow:hidden}
.stage3d{background:var(--stage);border-bottom:1px solid var(--line)}
#gl{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
.floating{background:color-mix(in srgb,var(--field) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.toolbar{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
.toolbar>*{pointer-events:auto}
.tools{display:flex;gap:2px;padding:3px;flex-wrap:wrap}
.tool{border:0;background:none;border-radius:7px;padding:4px 9px;cursor:pointer;font-size:12.5px;display:flex;align-items:center;gap:5px;min-height:30px}
.tool svg{width:15px;height:15px;flex:none}
.tool:hover{background:var(--hover)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tool:disabled{opacity:.4;cursor:default;background:none}
.toolhint{position:absolute;left:50%;top:58px;transform:translateX(-50%);font-size:12.5px;padding:5px 12px;pointer-events:none;white-space:nowrap}
.foldbar{position:absolute;left:12px;right:12px;bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 10px}
.play{width:32px;height:32px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:grid;place-items:center;flex:none}
.track{flex:1 1 200px;min-width:0;display:grid;gap:1px}
.track input{width:100%;accent-color:var(--accent)}
.step{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.step b{color:var(--ink);font-weight:500}
.pct{font-family:var(--font-num)}
.tbtns{display:flex;gap:5px;flex:none;flex-wrap:wrap}
.tbtns .btn{min-height:28px;padding:3px 9px;font-size:12px}

.stage2d{background:var(--mat);display:grid;grid-template-rows:auto minmax(0,1fr)}
.sheethead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;padding-block:7px;padding-inline:14px;color:var(--ink);font-size:12px;background:var(--panel);border-bottom:1px solid var(--line)}
.sheethead .ttl{font-weight:700;letter-spacing:.12em}
.legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.legend>span{display:inline-flex;align-items:center;gap:5px}.legend i{display:block;width:16px;height:0;border-top:2px solid}.legend .zh{opacity:.65}
.legend{color:var(--muted)}.legend .lc i{border-color:var(--accent)}.legend .lf i{border-color:var(--fold)}.legend .lp i{border-color:var(--accent);border-top-style:dashed}.legend .lg i{border-color:var(--fold);border-top-style:dashed;border-top-width:6px;opacity:.7}
.sheethead .btn{min-height:28px;padding:3px 10px;font-size:12px}
.sheethead select{width:auto;height:28px;font-size:12px}
#sheet{width:100%;height:100%;display:block;min-height:0;touch-action:none}
#sheet [data-panel]{cursor:pointer}
#sheet [data-part]{cursor:grab}
#svgOut{width:100%;height:110px;font-family:var(--font-num);font-size:11px;border:1px solid var(--line);border-radius:6px;background:var(--field);margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:30}
.kbd{font-family:var(--font-num);font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:0 4px}

@media (max-width:1100px){ .app{grid-template-columns:230px minmax(0,1fr) 270px} }
.drop-on{outline:3px dashed var(--sel);outline-offset:-8px}
/* Phone: ibisPaint-style — full-bleed canvas, round undo/redo top-left, square view buttons top-right,
   two sliders over an icon bar at the bottom, and windows that rise from the bar over the canvas. */
.mtop,.mbottom,.mpop,#mExitFs,.sheetgrip{display:none}
@media (max-width:860px){
  :root{--mbar-h:58px;--safe-b:env(safe-area-inset-bottom,0px)}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{font-size:14px}
  .app{display:block;height:100vh;height:100dvh}
  main{position:fixed;inset:0;display:block}
  main .stage{position:absolute;inset:0}
  .stage3d{border-bottom:0}
  .stage2d{grid-template-rows:minmax(0,1fr)}
  .sheethead,.toolbar,.foldbar,.brand,.deskonly{display:none}
  .app[data-mview="3d"] .stage2d,.app[data-mview="2d"] .stage3d{display:none}
  .toolhint{top:calc(62px + env(safe-area-inset-top,0px));white-space:normal;max-width:88%;text-align:center;z-index:12}

  .glass{background:color-mix(in srgb,var(--field) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:var(--shadow)}
  .mtop{display:flex;justify-content:space-between;align-items:flex-start;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;z-index:12;pointer-events:none}
  .mtop>*{pointer-events:auto;display:flex;gap:8px}
  .rbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
  .rbtn:disabled{opacity:.4}
  .sbtn{min-width:42px;height:42px;border-radius:11px;display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0 8px;font-size:11px;font-weight:700;letter-spacing:.04em}
  .sbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 0 0 2px var(--field),var(--shadow)}
  .rbtn svg,.sbtn svg{width:20px;height:20px}

  .mbottom{display:block;position:fixed;left:0;right:0;bottom:0;z-index:14;padding-bottom:var(--safe-b);border-width:1px 0 0;box-shadow:0 -4px 18px rgba(20,40,60,.08)}
  .msl{display:flex;align-items:center;gap:8px;padding:6px 12px 0}
  .msl:last-of-type{padding-bottom:4px}
  .msl input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:28px}
  .msl .lab{font-size:11px;color:var(--muted);width:44px;flex:none}
  .msl .val{font-family:var(--font-num);font-size:12px;width:52px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
  .pm{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--field);display:grid;place-items:center;flex:none;cursor:pointer;font-size:16px;line-height:1;padding:0;color:var(--ink)}
  .mplay{width:30px;height:30px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;cursor:pointer;padding:0}
  .mbar7{display:grid;grid-template-columns:repeat(7,1fr);height:var(--mbar-h);border-top:1px solid var(--line);margin-top:4px}
  .mb{border:0;background:none;display:grid;place-items:center;align-content:center;gap:2px;cursor:pointer;color:var(--ink);font-size:10px;position:relative;padding:0}
  .mb svg{width:23px;height:23px}
  .mb[aria-pressed="true"]{color:var(--accent)}
  .mb[aria-pressed="true"]::after{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
  .mb .swatch{width:22px;height:22px;border-radius:5px;border:1.5px solid var(--ink);box-shadow:inset 0 0 0 1.5px var(--field)}
  .mb .badge{position:absolute;top:7px;left:calc(50% + 4px);min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-family:var(--font-num);display:grid;place-items:center;padding:0 4px}

  .left,.right{position:fixed;left:8px;right:8px;bottom:calc(var(--mbar-h) + var(--safe-b) + 6px);max-height:62dvh;z-index:15;display:none;border:1px solid var(--line)!important;border-radius:16px;box-shadow:0 10px 40px rgba(20,40,60,.22);padding:8px 14px 18px;overscroll-behavior:contain}
  .app[data-msheet="left"] .left,.app[data-msheet="right"] .right{display:block}
  /* solid, not frosted: backdrop-filter would trap the fixed add-menu inside the window and clip it */
  .left.glass,.right.glass{background:var(--panel);backdrop-filter:none;-webkit-backdrop-filter:none}
  .addmenu summary{font-size:14px;font-weight:700;padding:8px 16px;border-radius:10px;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .sheetgrip{display:block;width:40px;height:5px;border-radius:3px;background:var(--grey);margin:0 auto 8px}
  .mpop{position:fixed;bottom:calc(var(--mbar-h) + var(--safe-b) + 6px);z-index:16;border-radius:14px;padding:8px}

<script>
(() => {
const $ = s => document.querySelector(s);
const HAS3D = !!window.THREE;

/* ================= data ================= */
const PAPERS = [
  {id:'coat',  name:'コートボール（裏グレー）', t:0.45, out:'#f6f6f2', inn:'#c8cbc7'},
  {id:'white', name:'白ボール（両面白）',       t:0.55, out:'#fbfbf8', inn:'#f0f0ea'},
  {id:'kraft', name:'クラフトボール',           t:0.50, out:'#c49a6c', inn:'#b98e60'},
  {id:'thin',  name:'厚口画用紙',               t:0.30, out:'#ffffff', inn:'#ffffff'},
  {id:'eflute',name:'Eフルート段ボール',        t:1.50, out:'#c9a273', inn:'#bf9566'},
];
// Colors are chosen in CMYK (%). The screen color is a simple conversion, so it is only a guide to the printed result.
const SWATCHES = [[0,0,3,3],[0,0,0,22],[0,25,45,25],[0,0,0,90],[86,41,0,43],[60,40,0,60],[0,22,10,0],[25,0,35,10],[30,10,0,5]];
const cmyk2hex = k => '#'+[0,1,2].map(i=>Math.round(255*(1-k[i]/100)*(1-k[3]/100)).toString(16).padStart(2,'0')).join('');
function hex2cmyk(hex){
  const n=parseInt(String(hex||'#000000').slice(1),16), r=(n>>16&255)/255, g=(n>>8&255)/255, b=(n&255)/255, K=1-Math.max(r,g,b);
  if (K>=1) return [0,0,0,100];
  return [r,g,b].map(x=>Math.round((1-x-K)/(1-K)*100)).concat(Math.round(K*100));
}
// where each color lives: [object getter, CMYK field, screen-color field]
const COLOR_SLOT = {outC:['body','outK','outC'], inC:['body','inK','inC'], pt:['part','colorK','color']};
const TYPE = {
  mailer:  {label:'郵送箱',       tag:'MLR'},
  tuckend: {label:'キャラメル箱', tag:'TCK'},
  tray:    {label:'トレー',       tag:'TRY'},
  sleeve:  {label:'スリーブ',     tag:'SLV', fit:'sleeve'},
  lidover: {label:'かぶせぶた',   tag:'LID', fit:'lid', flip:true},
  platform:{label:'台座インサート',tag:'INS', fit:'insert', flip:true},
  divider: {label:'仕切り板',     tag:'DIV', fit:'insert'},
  prism:   {label:'角柱・円柱',   tag:'PRS'},
  petalbox:{label:'花びら箱',     tag:'PTL'},
  flatbag: {label:'平袋',         tag:'BAG', flip:true},
};
const PART = {window:'窓', handle:'持ち手穴', hang:'吊り下げ穴', perf:'ミシン目', text:'文字', image:'画像'};
const partLabel = pt => PART[pt.type] + (pt.type==='text' ? '「'+esc(pt.text)+'」' : pt.type==='image' && pt.name ? '「'+esc(pt.name)+'」' : '');
const SHAPES = {rect:'角丸四角', circle:'円・楕円', arch:'アーチ', heart:'ハート'};
const HOSTS_FOR = {platform:['mailer','tray'], divider:['mailer','tray'], sleeve:['tray','mailer'], lidover:['tray']};
const paperOf = id => PAPERS.find(p=>p.id===id) || PAPERS[0];

function newBody(type, extra={}){
  const base = {
    mailer:  {name:'郵送箱', W:180,D:130,H:50, paper:'coat', opts:{double:true,tabs:2,tabW:20,r:8}},
    tuckend: {name:'キャラメル箱', W:90,D:40,H:140, paper:'white', opts:{r:5}},
    tray:    {name:'トレー', W:160,D:110,H:40, paper:'kraft', opts:{double:false}},
    sleeve:  {name:'スリーブ', W:164,D:112,H:44, paper:'white', opts:{notch:true,nr:12}, auto:true, outC:'#2f3b52'},
    lidover: {name:'かぶせぶた', W:164,D:114,H:30, paper:'white', opts:{double:false}, auto:true},
    platform:{name:'台座インサート', W:170,D:120,H:22, paper:'kraft', opts:{cols:3,rows:2,dia:36}, auto:true},
    divider: {name:'仕切り板', W:170,D:0,H:36, paper:'kraft', opts:{dir:'W',pos:0}, auto:true},
    prism:   {name:'六角柱', W:100,D:140,H:0, paper:'white', opts:{n:6, close:'cap', tuck:true, r:6}},
    flatbag: {name:'開封帯付き平袋', W:120,D:0,H:170, paper:'thin', opts:{tear:false, tearPos:22, band:8, top:'flap', topH:25}},
    petalbox:{name:'花びら箱', W:150,D:0,H:70, paper:'white', opts:{n:4, tab:true}, outC:'#b7d2a2'},
  }[type];
  const p = paperOf(extra.paper || base.paper);
  return Object.assign({id:nextId('b'), type, host:null, auto:false, t:p.t, outC:p.out, inC:p.inn, parts:[]}, structuredClone(base), {outC:base.outC||p.out}, extra);
}
function nextId(prefix){
  let n=0; for (const b of (S?.bodies||[])){ n=Math.max(n, +b.id.slice(1)||0); for (const pt of b.parts) n=Math.max(n, +pt.id.slice(1)||0); }

}
function defaultScene(){
  S = {bodies:[], assets:{}, fold:0.66, crease:'solid', sel:null};
  const b1 = newBody('mailer');
  b1.parts.push({id:nextId('p'), type:'window', panel:'lid', shape:'rect', u:0, v:6, w:90, h:52, r:6});
  b1.parts.push({id:nextId('p'), type:'text', panel:'front', u:0, v:0, text:'SAMPLE BOX', size:9, color:'#22324d'});
  S.bodies.push(b1);

/* ================= history ================= */
const hist = {undo:[], redo:[], last:0};
function snap(){ return JSON.stringify({bodies:S.bodies, sel:S.sel}); }
function remember(force){
  const now = performance.now();
  if (!force && now - hist.last < 700) { hist.last = now; return; }
  hist.undo.push(snap()); if (hist.undo.length>80) hist.undo.shift(); hist.redo.length=0; hist.last=now; syncHistBtns();
}
function restore(js){ const o=JSON.parse(js); S.bodies=o.bodies; S.sel=o.sel; update({all:true}); }
function undo(){ if(!hist.undo.length) return; hist.redo.push(snap()); restore(hist.undo.pop()); hist.last=0; syncHistBtns(); }
function redo(){ if(!hist.redo.length) return; hist.undo.push(snap()); restore(hist.redo.pop()); hist.last=0; syncHistBtns(); }
function syncHistBtns(){ $('#undo').disabled=$('#mUndo').disabled=!hist.undo.length; $('#redo').disabled=$('#mRedo').disabled=!hist.redo.length; }
let saveT=null;
function persist(){ clearTimeout(saveT); saveT=setTimeout(()=>{
  const used={}; for (const b of S.bodies) for (const pt of b.parts) if (pt.asset && S.assets[pt.asset]) used[pt.asset]=S.assets[pt.asset];
  try{ localStorage.setItem('pkglab-v2', JSON.stringify({...S, assets:used})); persist.warned=false; }
  catch(e){ if (!persist.warned){ persist.warned=true; toast('画像が大きく、ブラウザに保存しきれませんでした。再読み込みすると画像が消えます'); } }
}, 400); }

/* ================= images ================= */
// Images live in S.assets (data URLs) and parts point at them by id, so undo snapshots stay small.
const ASSET_URL=new Map(), IMG_EL=new Map();
function assetUrl(id){
  if (ASSET_URL.has(id)) return ASSET_URL.get(id);
  const src=S.assets[id]; if (!src) return '';
  let url=src;
  try{ const [h,b64]=src.split(','), bin=atob(b64), u8=new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
    url=URL.createObjectURL(new Blob([u8],{type:h.slice(5).split(';')[0]})); }catch(e){}
  ASSET_URL.set(id,url); return url;
}
function assetImg(id){ if (IMG_EL.has(id)) return IMG_EL.get(id); const im=new Image(); im.src=assetUrl(id); IMG_EL.set(id,im); return im; }
function readImageFile(file){
  return new Promise((res,rej)=>{
    if (!file || !/^image\//.test(file.type)) return rej(new Error('type'));
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{
      const max=1600, k=Math.min(1, max/Math.max(im.naturalWidth||1, im.naturalHeight||1));
      const w=Math.max(1,Math.round((im.naturalWidth||300)*k)), h=Math.max(1,Math.round((im.naturalHeight||150)*k));
      const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.drawImage(im,0,0,w,h); URL.revokeObjectURL(url);
      let alpha=false; try{ const d=x.getImageData(0,0,w,h).data; for (let i=3;i<d.length;i+=16) if (d[i]<250){ alpha=true; break; } }catch(e){ alpha=true; }
      const src = alpha ? c.toDataURL('image/png') : c.toDataURL('image/jpeg',0.88);
      const id='a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      S.assets[id]=src;
      res({asset:id, ar:w/h, name:(file.name||'画像').replace(/\.[^.]+$/,'').slice(0,40)});
    };
    im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('decode')); };
    im.src=url;
  });
}
function pickImage(){
  return new Promise(res=>{
    const inp=$('#imgFile'); inp.value='';
    inp.onchange=()=>{ const f=inp.files[0]; if(!f) return res(null); readImageFile(f).then(res).catch(()=>{ toast('この画像は読み込めませんでした'); res(null); }); };
    inp.click();

}
function fitImage(fr, ar){
  const ew=fr.ew||100, eh=fr.eh||60; let w=ew*0.5, h=w/ar;
  if (h>eh*0.6){ h=eh*0.6; w=h*ar; }
  return [Math.max(2,Math.round(w*2)/2), Math.max(2,Math.round(h*2)/2)];
}

function outline(nodes){
  const n=nodes.length, corners=[];
  for (let i=0;i<n;i++){
    const P=nodes[i], A=nodes[(i-1+n)%n], B=nodes[(i+1)%n], r=P[2]||0;
    const plain={p1:[P[0],P[1]],p2:[P[0],P[1]],arc:null};
    if (r<=0.01){ corners.push(plain); continue; }
    let u1=[A[0]-P[0],A[1]-P[1]], u2=[B[0]-P[0],B[1]-P[1]];
    const l1=Math.hypot(u1[0],u1[1]), l2=Math.hypot(u2[0],u2[1]);
    if (l1<1e-6||l2<1e-6){ corners.push(plain); continue; }

    const th=Math.acos(Math.max(-1,Math.min(1,u1[0]*u2[0]+u1[1]*u2[1])));
    if (th<0.02||th>Math.PI-0.02){ corners.push(plain); continue; }

    if (d>dmax){ d=dmax; rr=d*Math.tan(th/2); }

    let bx=u1[0]+u2[0], by=u1[1]+u2[1]; const bl=Math.hypot(bx,by); bx/=bl; by/=bl;
    const h=rr/Math.sin(th/2), C=[P[0]+bx*h,P[1]+by*h];
    const a1=Math.atan2(p1[1]-C[1],p1[0]-C[0]), a2=Math.atan2(p2[1]-C[1],p2[0]-C[0]);
    let da=a2-a1; while(da>Math.PI)da-=2*Math.PI; while(da<-Math.PI)da+=2*Math.PI;
    corners.push({p1,p2,arc:{C,r:rr,a1,da,sw:da>0?1:0}});

    } else poly.push(c.p1);

}
function segsToD(segs, ox, oy, closed){
  let d='', cur=null;

    if (!cur || dist(cur,s.a)>1e-6) d+=`M${f3(s.a[0]+ox)} ${f3(s.a[1]+oy)}`;
    if (s.t==='L') d+=`L${f3(s.b[0]+ox)} ${f3(s.b[1]+oy)}`;
    else d+=`A${f3(s.r)} ${f3(s.r)} 0 0 ${s.sw} ${f3(s.b[0]+ox)} ${f3(s.b[1]+oy)}`;
    cur=s.b;

    return [Math.round(Math.atan2(uy,ux)*2e4)+'|'+Math.round(c*200), Math.min(ta,tb), Math.max(ta,tb), ux, uy, c]; };

function partLocal(pt){
  const hw=pt.w/2, hh=pt.h/2;
  if (pt.type==='handle'){ const r=Math.min(hh,hw); return [[-hw,-hh,r],[hw,-hh,r],[hw,hh,r],[-hw,hh,r]]; }
  if (pt.type==='hang'){
    const R=pt.h/2, a=Math.max(0,hw-R), rc=pt.dia/2, n=144, out=[];
    for (let i=0;i<n;i++){ const th=i/n*Math.PI*2, dx=Math.cos(th), dy=Math.sin(th), ax=Math.abs(dx), ay=Math.abs(dy);

// glue flap width follows the panels it joins: 30% of the short side, kept between 5 and 15 mm

const map3 = (x,y) => new THREE.Vector3(-x,0,y);
function hingeSetup(p){
  const A=map3(...p.hinge[0]), B=map3(...p.hinge[1]);
  const axis=B.clone().sub(A).normalize(); const c=centroid(p.pts); const d=map3(c[0],c[1]).sub(A);
  if (axis.z*d.x - axis.x*d.z < 0) axis.negate();
  p.pivot=A; p.axis=axis;
}
function localMat(p,k){
  const m=new THREE.Matrix4(); if (!p.hinge) return m;
  const T=new THREE.Matrix4().makeTranslation(p.pivot.x,p.pivot.y,p.pivot.z);
  const R=new THREE.Matrix4().makeRotationAxis(p.axis, p.ang*k*Math.PI/180);
  const Ti=new THREE.Matrix4().makeTranslation(-p.pivot.x,-p.pivot.y,-p.pivot.z);
  return m.multiplyMatrices(T,R).multiply(Ti);
}
function orientMat(mdl, k=1){
  const m=new THREE.Matrix4();
  if (mdl.rotY) m.multiply(new THREE.Matrix4().makeRotationY(mdl.rotY*k));
  if (mdl.flip) m.multiply(new THREE.Matrix4().makeRotationZ(Math.PI*k));
  return m;
}
function frameOf(mdl, p){
  const bb=bboxOf(p.pts), c=[(bb[0]+bb[2])/2,(bb[1]+bb[3])/2];
  if (!HAS3D) return {c, up:[0,-1], rt:[1,0], bb};
  const Rt=orientMat(mdl).multiply(mdl.A[p.id]);
  const nOut=new THREE.Vector3(0,-1,0).transformDirection(Rt);
  const upW = Math.abs(nOut.y)>0.7 ? new THREE.Vector3(0,0,-1) : new THREE.Vector3(0,1,0);
  const rtW = upW.clone().cross(nOut);
  const inv = Rt.clone().invert();
  const toNet = w => { const l=w.clone().transformDirection(inv); const v=[-l.x,l.z]; const n=Math.hypot(v[0],v[1])||1; return [v[0]/n,v[1]/n]; };
  const up=toNet(upW), rt=toNet(rtW);
  const ew=Math.abs(rt[0])*(bb[2]-bb[0])+Math.abs(rt[1])*(bb[3]-bb[1]);
  const eh=Math.abs(up[0])*(bb[2]-bb[0])+Math.abs(up[1])*(bb[3]-bb[1]);
  return {c, up, rt, bb, ew, eh};
}
const toNet = (fr,u,v) => [fr.c[0]+u*fr.rt[0]+v*fr.up[0], fr.c[1]+u*fr.rt[1]+v*fr.up[1]];
const toUV = (fr,q) => { const dx=q[0]-fr.c[0], dy=q[1]-fr.c[1]; return [dx*fr.rt[0]+dy*fr.rt[1], dx*fr.up[0]+dy*fr.up[1]]; };

let MD = {}, ORDER = [], SHEET = null;
function buildAll(){
  const models={}, done=new Set(), order=[];
  const visit = b => { if (done.has(b.id)) return; done.add(b.id); const h=S.bodies.find(x=>x.id===b.host); if (h) visit(h); else b.host=null; order.push(b); };
  S.bodies.forEach(visit);
  for (const b of order){
    const d=resolveDims(b, models);
    const r=buildBody(b,d);
    const mdl={b, d, info:r.info, panels:r.panels, byId:Object.fromEntries(r.panels.map(p=>[p.id,p])), notes:r.warns.map(t=>({k:'warn',t})), flip:!!TYPE[b.type].flip, rotY:(b.type==='divider'&&b.opts.dir==='D')?Math.PI/2:0, perfs:(r.perfs||[]).slice(), slits:r.slits||[], guides:r.guides||[], texts:[], images:[], partGeo:{}};
    models[b.id]=mdl;
    if (HAS3D){
      mdl.A={};
      for (const p of mdl.panels){ if (p.hinge) hingeSetup(p); mdl.A[p.id] = p.parent ? mdl.A[p.parent].clone().multiply(localMat(p,1)) : new THREE.Matrix4(); }
      const pts=[]; for (const p of mdl.panels) for (const q of p.pts) pts.push(map3(q[0],q[1]).applyMatrix4(mdl.A[p.id]));
      const bx=new THREE.Box3().setFromPoints(pts); mdl.box=bx;
      const c=bx.getCenter(new THREE.Vector3());
      mdl.anchorAsm=new THREE.Vector3(c.x, mdl.flip?bx.max.y:bx.min.y, c.z);
    }
    for (const p of mdl.panels) p.fr = frameOf(mdl, p);
    applyParts(mdl);
    for (const p of mdl.panels){ p.o=outline(p.pts); p.ho=p.holes.map(h=>outline(h.nodes)); }
    const hinges=mdl.panels.filter(p=>p.hinge).map(p=>({t:'L',a:p.hinge[0],b:p.hinge[1],soft:p.soft}));
    const folds=unionLines(hinges.filter(h=>!h.soft),[]);
    const straight=[], arcs=[];
    for (const p of mdl.panels) for (const s of p.o.segs) (s.t==='L'?straight:arcs).push(s);
    mdl.cuts=unionLines(straight.concat(mdl.slits), hinges).concat(arcs); mdl.folds=folds;
    mdl.softParents=new Set(mdl.panels.filter(p=>p.soft).map(p=>p.parent));
    const all=[]; for (const p of mdl.panels) all.push(...p.o.poly);
    mdl.bb=bboxOf(all);
    if (b.host && b.auto) {
      const big = b.type==='platform' && d.H < b.H ? '台座の高さを外箱に合わせて低くしました。' : null;
      if (big) mdl.notes.push({k:'ok', t:big});
    }
  }
  MD=models; ORDER=order;
  layoutSheet(); placeBodies();
}
function applyParts(mdl){
  const b=mdl.b; let mirrored=0;
  for (const pt of b.parts){
    const p=mdl.byId[pt.panel];
    if (!p){ mdl.notes.push({k:'warn', t:`${PART[pt.type]}を置いていた面がなくなりました。面を選び直してください。`}); continue; }
    const fr=p.fr, lab=`${p.name}の${PART[pt.type]}`;
    if (pt.type==='perf'){
      const g=perfGeom(p,pt);
      for (const sg of g.segs) mdl.perfs.push({panel:p.id, ...sg});
      if (!g.segs.length) mdl.notes.push({k:'warn', t:`${lab}が面の外に出ています。位置を戻してください。`});
      mdl.partGeo[pt.id]={panel:p.id, nodes:g.poly.map(q=>[q[0],q[1],0]), poly:g.poly};
      continue;
    }
    if (pt.type==='image'){
      const w=pt.w, h=pt.h;
      const nodes=[[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]].map(([u,v])=>{ const q=toNet(fr,pt.u+u,pt.v+v); return [q[0],q[1],0]; });
      mdl.images.push({panel:p.id, pt, w, h, c:toNet(fr,pt.u,pt.v), rt:fr.rt, up:fr.up});
      mdl.partGeo[pt.id]={panel:p.id, nodes, poly:nodes.map(q=>[q[0],q[1]])};
      if (!S.assets[pt.asset]) mdl.notes.push({k:'warn', t:`${lab}のデータが見つかりません。差し替えてください。`});
      else if (!inside(bboxOf(nodes), fr.bb, 1)) mdl.notes.push({k:'warn', t:`${lab}が面からはみ出しています。`});
      continue;
    }
    if (pt.type==='text'){
      const w=Math.max(4,textWidth(pt)), h=pt.size*1.25;
      const nodes=[[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]].map(([u,v])=>{ const q=toNet(fr,pt.u+u,pt.v+v); return [q[0],q[1],0]; });
      mdl.texts.push({panel:p.id, pt, w, h, c:toNet(fr,pt.u,pt.v), rt:fr.rt, up:fr.up});
      mdl.partGeo[pt.id]={panel:p.id, nodes, poly:nodes.map(q=>[q[0],q[1]])};
      if (!inside(bboxOf(nodes), fr.bb, 1)) mdl.notes.push({k:'warn', t:`${lab}が面からはみ出しています。`});
      continue;
    }
    const nodes=partLocal(pt).map(([u,v,r])=>{ const q=toNet(fr,pt.u+u,pt.v+v); return [q[0],q[1],r]; });
    const bb=bboxOf(nodes);
    if (!inside(bb, fr.bb, 3)) mdl.notes.push({k:'warn', t:`${lab}が折り線や端にかかっています。端から3mm以上内側に収めてください。`});
    p.holes.push({nodes, part:pt.id});
    mdl.partGeo[pt.id]={panel:p.id, nodes, poly:outline(nodes).poly};
    if (!HAS3D) continue;
    const Ap=mdl.A[p.id], world=nodes.map(q=>map3(q[0],q[1]).applyMatrix4(Ap));
    for (const q of mdl.panels){
      if (q===p) continue;
      if (b.type==='flatbag' && p.id!==q.id && /^(front|back)/.test(p.id) && /^(front|back)/.test(q.id) && !(p.id==='backA'&&q.id==='backB') && !(p.id==='backB'&&q.id==='backA')) continue;
      const inv=mdl.A[q.id].clone().invert(); let co=true; const net=[];
      for (let i=0;i<world.length;i++){ const l=world[i].clone().applyMatrix4(inv); if (Math.abs(l.y)>0.05){co=false;break;} net.push([-l.x,l.z,nodes[i][2]]); }
      if (!co) continue;
      const mb=bboxOf(net), qb=bboxOf(q.pts);
      if (inside(mb,qb,1.5)){ q.holes.push({nodes:net, mirrorOf:pt.id}); mirrored++; }
      else if (overlaps(mb,qb)) mdl.notes.push({k:'warn', t:`${lab}の裏に「${q.name}」が一部重なり、内側でふさがります。位置か大きさを調整してください。`});
    }
  }
  if (mirrored) mdl.notes.push({k:'ok', t:`内側に重なる板（${mirrored}か所）にも、同じ位置の穴を自動で抜きました。`});
}
function layoutSheet(){
  let x=0, maxH=0; const gap=30, cap=14;
  for (const b of S.bodies){ const m=MD[b.id]; if(!m) continue; const w=m.bb[2]-m.bb[0], h=m.bb[3]-m.bb[1]; m.ox=x-m.bb[0]; m.oy=cap-m.bb[1]; x+=w+gap; maxH=Math.max(maxH,h+cap); }
  SHEET={w:Math.max(1,x-gap), h:maxH};
}
function placeBodies(){
  if (!HAS3D) return;
  const roots=S.bodies.filter(b=>!b.host && MD[b.id]);
  const widths=roots.map(b=>{ let w=MD[b.id].box.max.x-MD[b.id].box.min.x; for (const c of S.bodies) if (c.host===b.id && MD[c.id]) w=Math.max(w, MD[c.id].box.max.x-MD[c.id].box.min.x); return w; });
  const gap=90, total=widths.reduce((a,b)=>a+b,0)+gap*Math.max(0,roots.length-1);
  let cur=total/2;
  roots.forEach((b,i)=>{ const m=MD[b.id]; m.asmPos=new THREE.Vector3(cur-widths[i]/2,0,0); m.explPos=m.asmPos.clone(); cur-=widths[i]+gap; });
  for (const b of ORDER){
    const m=MD[b.id]; if (!b.host) continue; const hm=MD[b.host], hp=hm.asmPos, floor=hm.d.t+0.15;
    if (b.type==='platform'){ m.asmPos=hp.clone().add(new THREE.Vector3(0,floor,0)); m.explPos=m.asmPos.clone().add(new THREE.Vector3(0,hm.d.H+40+m.d.H,0)); }
    else if (b.type==='divider'){ const o=b.opts.pos||0; m.asmPos=hp.clone().add(b.opts.dir==='D'?new THREE.Vector3(-o,floor,0):new THREE.Vector3(0,floor,-o)); m.explPos=m.asmPos.clone().add(new THREE.Vector3(0,hm.d.H+45,0)); }
    else if (b.type==='lidover'){ m.asmPos=hp.clone().add(new THREE.Vector3(0,Math.max(0,hm.d.H+hm.d.t-m.d.H+0.3),0)); m.explPos=m.asmPos.clone().add(new THREE.Vector3(0,m.d.H+50,0)); }
    else if (b.type==='sleeve'){ m.asmPos=hp.clone().add(new THREE.Vector3(0,-(m.d.t+0.3),0)); m.explPos=m.asmPos.clone().add(new THREE.Vector3(0,0,m.d.D*1.1+20)); }
    else { m.asmPos=hp.clone(); m.explPos=hp.clone(); }
  }
  for (const b of S.bodies){
    const m=MD[b.id]; if(!m) continue;
    const cx=(m.bb[0]+m.bb[2])/2, cy=(m.bb[1]+m.bb[3])/2;
    m.anchorFlat=map3(cx,cy);
    m.flatPos=map3(m.ox+cx-SHEET.w/2, m.oy+cy-SHEET.h/2);
    m.lift=Math.max(m.bb[2]-m.bb[0], m.bb[3]-m.bb[1])/2+20;
  }
}
function phases(p){ return {fb:clamp01(p/0.6), a:clamp01((p-0.6)/0.2), fc:clamp01((p-0.8)/0.2)}; }

/* ================= 2D sheet ================= */
const dimsText=(b,m)=> b.type==='flatbag' ? `${f3(m.d.W)}×${f3(m.d.H)}` : b.type==='prism' ? `⌀${f3(m.d.W)}×長さ${f3(m.d.D)}・${clampInt(b.opts.n,3,48)}面` : b.type==='petalbox' ? `⌀${f3(m.d.W)}×高さ${f3(m.d.H)}・${clampInt(b.opts.n,3,8)}枚` : `${f3(m.d.W)}×${f3(m.d.D)}×${f3(m.d.H)}`;
function textOn(hex){ const c=parseInt(hex.slice(1),16); const r=(c>>16)&255,g=(c>>8)&255,b=c&255; return (0.299*r+0.587*g+0.114*b)>140 ? 'rgba(30,40,60,.42)' : 'rgba(255,255,255,.6)'; }
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function bodyPaths(m, ox, oy){
  const cut = segsToD(m.cuts.filter(s=>s.t==='L'),ox,oy,false) + m.cuts.filter(s=>s.t==='A').map(s=>segsToD([s],ox,oy,false)).join('')
            + m.panels.flatMap(p=>p.ho.map(h=>segsToD(h.segs,ox,oy,true))).join('');
  const fold = segsToD(m.folds,ox,oy,false);
  const perf = m.perfs.map(s=>`M${f3(s.a[0]+ox)} ${f3(s.a[1]+oy)}L${f3(s.b[0]+ox)} ${f3(s.b[1]+oy)}`).join('');
  return {cut, fold, perf};
}
// image local x → panel right, local y (down) → panel down, so it reads upright on the folded box
function imageSvg(t, ox, oy, href){
  const W=f3(t.w), H=f3(t.h);
  return `<image ${href.startsWith('data:')?'xlink:href':'href'}="${href}" x="${f3(-t.w/2)}" y="${f3(-t.h/2)}" width="${W}" height="${H}" preserveAspectRatio="none" transform="matrix(${f3(t.rt[0])} ${f3(t.rt[1])} ${f3(-t.up[0])} ${f3(-t.up[1])} ${f3(t.c[0]+ox)} ${f3(t.c[1]+oy)})"/>`;
}
function textSvg(t, ox, oy, fill){
  const ang=Math.atan2(t.rt[1],t.rt[0])*180/Math.PI, x=f3(t.c[0]+ox), y=f3(t.c[1]+oy);
  const ck=t.pt.colorK||hex2cmyk(t.pt.color);
  return `<text data-cmyk="C${ck[0]} M${ck[1]} Y${ck[2]} K${ck[3]}" x="${x}" y="${y}" font-size="${f3(t.pt.size)}" font-weight="700" font-family="Zen Kaku Gothic New, sans-serif" text-anchor="middle" dominant-baseline="central" fill="${fill||t.pt.color}" transform="rotate(${f3(ang)} ${x} ${y})">${esc(t.pt.text)}</text>`;
}
let sheetView=null;
function drawSheet(){
  const pad=14, vb=sheetView?sheetView.slice():[-pad, -pad, SHEET.w+pad*2, SHEET.h+pad*2];
  const dash = S.crease==='dash' ? ' stroke-dasharray="6 3"' : '';
  const sel=S.sel||{};
  let out='';
  for (const b of S.bodies){
    const m=MD[b.id]; if(!m) continue; const ox=m.ox, oy=m.oy;
    const fills=m.panels.map(p=>`<path vector-effect="non-scaling-stroke" data-body="${b.id}" data-panel="${p.id}" d="${segsToD(p.o.segs,ox,oy,true)}${p.ho.map(h=>segsToD(h.segs,ox,oy,true)).join('')}" fill-rule="evenodd"/>`).join('');
    const {cut,fold,perf}=bodyPaths(m,ox,oy);
    const fs=Math.max(2.2, Math.min(10, Math.min(m.d.H||m.d.W, m.d.W)/5));
    const labs=m.panels.filter(p=>p.label && !m.texts.some(t=>t.panel===p.id) && !m.images.some(t=>t.panel===p.id)).map(p=>{ const bb=bboxOf(p.o.poly); return `<text x="${f3((bb[0]+bb[2])/2+ox)}" y="${f3((bb[1]+bb[3])/2+oy)}">${p.label}</text>`; }).join('');
    const selP = sel.body===b.id && sel.kind==='panel' ? m.byId[sel.panel] : null;
    const hl = selP ? `<path d="${segsToD(selP.o.segs,ox,oy,true)}" fill="rgba(20,85,145,.12)" stroke="var(--sel)" stroke-width="2.4" vector-effect="non-scaling-stroke" pointer-events="none"/>` : '';
    const parts = b.parts.filter(pt=>m.partGeo[pt.id]).map(pt=>{ const g=m.partGeo[pt.id]; const on=sel.kind==='part'&&sel.part===pt.id;
      return `<path data-body="${b.id}" data-part="${pt.id}" d="M${g.poly.map(q=>`${f3(q[0]+ox)} ${f3(q[1]+oy)}`).join('L')}Z" fill="${on?'rgba(255,201,40,.22)':'rgba(0,0,0,0)'}" stroke="${on?'var(--sel)':'none'}" stroke-width="2.2" vector-effect="non-scaling-stroke"/>`; }).join('');
    const bsel = sel.body===b.id;
    out += `<g>
      <text x="${f3(ox+m.bb[0])}" y="${f3(oy+m.bb[1]-5)}" font-size="${f3(Math.max(2.5,Math.min(9,SHEET.w/70,(m.bb[2]-m.bb[0])/((b.name.length+dimsText(b,m).length)*0.75))))}" fill="${bsel?'var(--sel)':'var(--mat-ink)'}" font-family="Zen Kaku Gothic New, sans-serif" font-weight="700">${esc(b.name)}　${dimsText(b,m)}</text>
      <g fill="${b.outC}" stroke="${b.outC}" stroke-width="1" stroke-linejoin="round" style="filter:drop-shadow(0 1.2px 1.6px rgba(0,0,0,.35))">${fills}</g>
      <g font-family="Zen Kaku Gothic New, sans-serif" font-size="${f3(fs)}" text-anchor="middle" dominant-baseline="central" fill="${textOn(b.outC)}" pointer-events="none">${labs}</g>
      <g pointer-events="none">${m.images.map(t=>imageSvg(t,ox,oy,assetUrl(t.pt.asset))).join('')}</g>
      <g pointer-events="none">${m.texts.map(t=>textSvg(t,ox,oy)).join('')}</g>
      ${m.guides.length?`<g fill="url(#hatch)" stroke="rgba(214,53,43,.55)" stroke-width="0.8" stroke-dasharray="3 2" pointer-events="none">${m.guides.map(r=>`<rect x="${f3(r[0]+ox)}" y="${f3(r[1]+oy)}" width="${f3(r[2]-r[0])}" height="${f3(r[3]-r[1])}" vector-effect="non-scaling-stroke"/>`).join('')}</g>`:''}
      ${hl}

      <g fill="none" stroke="#e0362b" stroke-width="1.1"${dash} pointer-events="none"><path d="${fold}" vector-effect="non-scaling-stroke"/></g>
      <g fill="none" stroke="var(--cut)" stroke-width="1.2" stroke-dasharray="4 2.5" pointer-events="none"><path d="${perf}" vector-effect="non-scaling-stroke"/></g>
      ${parts}
    </g>`;
  }
  const sv=$('#sheet');
  sv.setAttribute('viewBox', vb.map(f3).join(' '));
  sv.innerHTML = `<defs>
      <pattern id="hatch" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V3" stroke="rgba(214,53,43,.35)" stroke-width=".6"/></pattern>
      <pattern id="g10" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="var(--mat-line)" stroke-width=".3"/></pattern>
      <pattern id="g50" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#g10)"/><path d="M50 0H0V50" fill="none" stroke="var(--mat-major)" stroke-width=".5"/></pattern>
    </defs><rect x="${vb[0]-3000}" y="${vb[1]-3000}" width="${vb[2]+6000}" height="${vb[3]+6000}" fill="url(#g50)" data-bg="1"/>${out}`;
}
function exportSvg(ids){
  const list=S.bodies.filter(b=>ids.includes(b.id) && MD[b.id]);
  const m0=5, gap=20; let x=m0, h=0; const parts=[];
  const dash = S.crease==='dash' ? ' stroke-dasharray="3 1.5"' : '';
  let cut='', fold='', perf='', print='';
  for (const b of list){
    const m=MD[b.id], ox=x-m.bb[0], oy=m0-m.bb[1];
    const p=bodyPaths(m,ox,oy); cut+=p.cut; fold+=p.fold; perf+=p.perf;
    print+=m.images.map(t=>imageSvg(t,ox,oy,S.assets[t.pt.asset]||'')).join('')+m.texts.map(t=>textSvg(t,ox,oy)).join('');
    parts.push(`${b.name} ${dimsText(b,m)}mm t${m.d.t}`);
    x+=(m.bb[2]-m.bb[0])+gap; h=Math.max(h,m.bb[3]-m.bb[1]);
  }
  const W=x-gap+m0, H=h+2*m0;
  return `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${f3(W)}mm" height="${f3(H)}mm" viewBox="0 0 ${f3(W)} ${f3(H)}">
  <title>${esc(parts.join(' / '))}</title>
  <g id="print">${print}</g>
  <g id="cut" fill="none" stroke="#2741a6" stroke-width="0.25" stroke-linejoin="round"><path d="${cut}"/></g>
  <g id="crease" fill="none" stroke="#e0362b" stroke-width="0.25"${dash}><path d="${fold}"/></g>
  <g id="perforation" fill="none" stroke="#2741a6" stroke-width="0.25" stroke-dasharray="2 1"><path d="${perf}"/></g>
</svg>`;
}

let renderer, scene, camera, controls, root, matMap={}, groups={}, bodyGroups={}, pickables=[];
const texCache=new Map(), imgTexCache=new Map();
function imageTexture(id){

function bindProps(){
  const box=$('#props');

    if (el.type==='number') syncSlider(el);
    const b=S.bodies.find(x=>x.id===sel.body); if(!b) return;
    const id=el.id, num=+el.value;
    const commit=(fn,opts={props:false})=>{ remember(); fn(); update(opts); };
    if (id==='b-name') return commit(()=>{ b.name=el.value||TYPE[b.type].label; }, {props:false});
    if (id.startsWith('bd-')){ if(!isFinite(num)||num<5) return; return commit(()=>{ b[id.slice(3)]=num; }); }
    if (id==='b-t'){ if(!isFinite(num)||num<0.1||num>3) return; return commit(()=>{ b.t=num; }); }
    if (id.startsWith('ck-')){
      const [,key,i]=id.split('-'); if (!isFinite(num) || el.value==='') return;
      const [kind,fk,hk]=COLOR_SLOT[key], tgt=kind==='part'?b.parts.find(x=>x.id===sel.part):b; if (!tgt) return;
      return commit(()=>{ const k=(tgt[fk]||hex2cmyk(tgt[hk])).slice(); k[+i]=Math.max(0,Math.min(100,Math.round(num))); tgt[fk]=k; tgt[hk]=cmyk2hex(k);
        const chip=document.getElementById('chip-'+key); if (chip) chip.style.background=tgt[hk];
        document.querySelectorAll(`.sw[data-color="${key}"]`).forEach(s=>s.setAttribute('aria-pressed', String(s.dataset.k===k.join(',')))); });
    }
    if (id.startsWith('bo-')){ const k=id.slice(3); if (el.type==='checkbox') return commit(()=>{ b.opts[k]=el.checked; }); if(!isFinite(num)) return; return commit(()=>{ b.opts[k]= (k==='cols'||k==='rows')?Math.max(1,Math.round(num)):k==='n'?clampInt(num,3,b.type==='petalbox'?8:48):num; }); }
    if (id==='b-auto') return commit(()=>{ b.auto=el.checked; }, {all:true});
    if (id.startsWith('pp-')){
      const pt=b.parts.find(x=>x.id===sel.part); if(!pt) return; const k=id.slice(3);
      if (k==='text') return commit(()=>{ pt.text=el.value; });
      if (k==='lock') return commit(()=>{ pt.lock=el.checked; });
      if (pt.type==='image' && (k==='w'||k==='h') && pt.lock!==false){ if(!isFinite(num)||num<1) return;
        return commit(()=>{ pt[k]=num; const o=k==='w'?'h':'w'; pt[o]=Math.round((k==='w'?num/pt.ar:num*pt.ar)*10)/10; const oe=document.getElementById('pp-'+o); if (oe) oe.value=pt[o]; }); }
      if (k==='shape') return commit(()=>{ pt.shape=el.value; }, {all:true});
      if (k==='ang'||k==='angR'){ if(!isFinite(num)) return; return commit(()=>{ pt.ang=num; delete pt.dir; const o=document.getElementById(k==='ang'?'pp-angR':'pp-ang'); if(o) o.value=k==='ang'?((num+90)%180+180)%180-90:num; markAngSeg(num); }); }
      if (!isFinite(num)) return;
      if (['w','h','size','dia'].includes(k) && num<1) return;
      return commit(()=>{ pt[k]=num; });
    }
  });
  box.addEventListener('change',ev=>{
    const el=ev.target, sel=S.sel; if(!sel) return;
    if (el.classList.contains('prs')){ document.getElementById(el.dataset.for)?.dispatchEvent(new Event('change',{bubbles:true})); return; } const b=S.bodies.find(x=>x.id===sel.body); if(!b) return;
    if (el.id==='b-paper'){ remember(true); const p=paperOf(el.value); b.paper=p.id; b.t=p.t; b.outC=p.out; b.inC=p.inn; b.outK=hex2cmyk(p.out); b.inK=hex2cmyk(p.inn); update({all:true}); }
    if ((el.type==='checkbox' && el.id.startsWith('bo-')) || el.id==='bo-n') update({all:true});
  });
  box.addEventListener('click',ev=>{
    const el=ev.target.closest('button,a'); if(!el) return; const sel=S.sel; if(!sel) return;
    const b=S.bodies.find(x=>x.id===sel.body);
    if (el.dataset.sel){ ev.preventDefault(); selectFrom(el); return; }
    if (el.dataset.color){ const [kind,fk,hk]=COLOR_SLOT[el.dataset.color], tgt=kind==='part'?b.parts.find(x=>x.id===sel.part):b; if (!tgt) return;
      remember(true); const k=el.dataset.k.split(',').map(Number); tgt[fk]=k; tgt[hk]=cmyk2hex(k); update({all:true}); return; }
    if (el.closest('[data-seg]')){ const seg=el.closest('[data-seg]').dataset.seg, v=el.dataset.v; remember(true);
      if (seg==='tabs') b.opts.tabs=+v; if (seg==='dir') b.opts.dir=v; if (seg==='close') b.opts.close=v; if (seg==='top') b.opts.top=v; if (seg==='style') b.opts.style=v; if (seg==='edge') b.opts.edge=v;
      if (seg==='pang'){ const pt=b.parts.find(x=>x.id===sel.part); pt.ang=+v; delete pt.dir; }
      update({all:true, frame:seg==='dir'}); return; }
    if (el.dataset.addpart){ addPart(b.id, sel.panel, el.dataset.addpart, null); return; }
    if (el.id==='delPart'){ deletePart(b.id, sel.part); return; }
    if (el.id==='pp-replace'){ const pt=b.parts.find(x=>x.id===sel.part); pickImage().then(im=>{ if(!im||!pt) return; remember(true); pt.asset=im.asset; pt.name=im.name; pt.ar=im.ar; pt.h=Math.round(pt.w/im.ar*10)/10; update({all:true}); }); return; }
    if (el.id==='pp-ratio'){ const pt=b.parts.find(x=>x.id===sel.part); if(!pt) return; remember(true); pt.h=Math.round(pt.w/pt.ar*10)/10; pt.lock=true; update({all:true}); return; }
    if (el.id==='delBody'){ if (!el.classList.contains('armed')){ el.classList.add('armed'); el.textContent='もう一度押すと削除'; setTimeout(()=>{ if(el.isConnected){ el.classList.remove('armed'); el.textContent='箱を削除'; } },2500); return; } deleteBody(b.id); return; }
    if (el.id==='saveOne'){ const ids=[b.id, ...S.bodies.filter(x=>x.host===b.id).map(x=>x.id)]; saveSvg(ids); return; }
  });
}
function markAngSeg(v){ document.querySelectorAll('[data-seg="pang"] button').forEach(b=>b.setAttribute('aria-pressed', String(+b.dataset.v===+v))); }
function selectFrom(el){
  const k=el.dataset.sel, body=el.dataset.body;
  S.sel = k==='body' ? {kind:'body',body} : k==='part' ? {kind:'part',body,part:el.dataset.part} : {kind:'panel',body,panel:el.dataset.panel};
  update({all:true});
}

/* ================= update loop ================= */
function update(o={}){
  buildAll();
  drawSheet();
  build3D();
  if (o.frame) frameCamera();
  if (o.tree!==false) renderTree();
  if (o.all || o.props) renderProps();
  syncSizeRow();
  syncHistBtns();
  persist();
}

/* ================= fold animation ================= */
let playing=null;
const setPlayIcon=d=>{ $('#playIcon').setAttribute('d',d); $('#mPlayIcon').setAttribute('d',d); };
function stopPlay(){ if(playing){ cancelAnimationFrame(playing); playing=null; } setPlayIcon('M3 1.5v11l9-5.5z'); }
function animateTo(target, from=S.fold, dur){
  stopPlay();
  dur = dur || Math.max(500, Math.abs(target-from)*3200);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){ S.fold=target; $('#fold').value=$('#mFold').value=target*1000; applyFold(target); persist(); return; }
  setPlayIcon('M3 1.5h3v11H3zM8 1.5h3v11H8z');
  const t0=performance.now();
  const step=now=>{ const k=Math.min(1,(now-t0)/dur); S.fold=from+(target-from)*k; $('#fold').value=$('#mFold').value=S.fold*1000; applyFold(S.fold);
    if (k<1) playing=requestAnimationFrame(step); else { playing=null; setPlayIcon('M3 1.5v11l9-5.5z'); persist(); } };
  playing=requestAnimationFrame(step);
}

/* ================= export ================= */
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2400); }
function showSvg(svg){ const ta=$('#svgOut'); ta.value=svg; ta.hidden=false; ta.focus(); ta.select(); }
async function saveSvg(ids){
  const svg=exportSvg(ids);
  const one = ids.length===1 ? S.bodies.find(b=>b.id===ids[0]) : null;
  const name = one ? `${one.type}_${Math.round(MD[one.id].d.W)}x${Math.round(MD[one.id].d.D)}x${Math.round(MD[one.id].d.H)}.svg` : 'package_dielines.svg';
  let dl=null; try{ dl = window.claude?.use ? await window.claude.use('downloads') : null; }catch(e){}
  if (!dl && !window.claude){ const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'})); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000); toast('SVGを保存しました'); return; }
  if (!dl){ showSvg(svg); toast('この画面では保存できないため、右下にSVGコードを表示しました'); return; }
  try{ await dl.save({filename:name, data:svg}); toast('SVGを保存しました'); }
  catch(e){ if (e?.code==='declined') return; showSvg(svg); toast('保存できなかったため、SVGコードを表示しました'); }
}
function copySvg(){
  const svg=exportSvg(S.bodies.map(b=>b.id));
  const p = navigator.clipboard?.writeText ? navigator.clipboard.writeText(svg) : Promise.reject();
  p.then(()=>toast('SVGをコピーしました')).catch(()=>{ showSvg(svg); toast('コードを選択しました。手動でコピーしてください'); });
}

/* ================= phone chrome ================= */
const isPhone=()=>matchMedia('(max-width:860px)').matches;
const APP=()=>document.querySelector('.app');
function closePops(except){ document.querySelectorAll('.mpop').forEach(p=>{ if (p!==except) p.classList.remove('open'); }); $('#mExport')?.setAttribute('aria-pressed', String(except?.id==='mExportPop')); }
function setView(v){ APP().dataset.mview=v; document.querySelectorAll('.mtop [data-mview]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.mview===v))); }
function setSheet(t){
  const app=APP(); if (t) app.dataset.msheet=t; else delete app.dataset.msheet;
  $('#mLayers').setAttribute('aria-pressed', String(t==='left'));
  $('#mProps').setAttribute('aria-pressed', String(t==='right'));
  closePops();
}
const toggleSheet=t=>setSheet(APP().dataset.msheet===t ? null : t);
// When a window is already open, follow the selection to the settings window (ibisPaint keeps the canvas clear otherwise).
function showTab(t){ if (isPhone() && APP().dataset.msheet) setSheet(t); }
// "大きさ" slider: width of the selected part (text: letter height). Other side follows the current ratio.
const SIZE_TYPES=['window','handle','hang','text','image'];
function selPart(){ const sel=S.sel; if (sel?.kind!=='part') return null; const b=S.bodies.find(x=>x.id===sel.body); const pt=b?.parts.find(x=>x.id===sel.part); return pt?{b,pt}:null; }
function syncSizeRow(){
  const r=$('#mSizeRow'), sp=selPart(); const on=!!sp && SIZE_TYPES.includes(sp.pt.type);
  r.hidden=!on; if (!on) return;
  const {b,pt}=sp, fr=MD[b.id]?.byId[pt.panel]?.fr, inp=$('#mSize');
  const isText=pt.type==='text', v=isText?pt.size:pt.w, max=Math.max(v, Math.round(isText?(fr?.eh||60)*0.8:(fr?.ew||100)));
  inp.min=isText?2:4; inp.max=max; inp.step=0.5; if (document.activeElement!==inp) inp.value=v;
  $('#mSizeVal').textContent=f3(v)+'mm';
}
function setPartSize(v){
  const sp=selPart(); if (!sp) return; const {pt}=sp; v=Math.max(1,Math.round(v*2)/2);
  if (pt.type==='text') pt.size=v;
  else { const k=v/(pt.w||1); pt.w=v; if (pt.type==='image' && pt.lock!==false) pt.h=Math.round(v/pt.ar*10)/10; else if (pt.type!=='hang') pt.h=Math.round(pt.h*k*10)/10; }
  update({props:false, tree:false});
}
function bindPhone(){
  $('#mUndo').addEventListener('click',undo); $('#mRedo').addEventListener('click',redo);
  document.querySelectorAll('.mtop [data-mview]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.mview)));

  const mf=$('#mFold'); mf.value=S.fold*1000;
  mf.addEventListener('input',()=>{ stopPlay(); S.fold=mf.value/1000; $('#fold').value=mf.value; applyFold(S.fold); persist(); });

  $('#mExport').addEventListener('click',e=>{ e.stopPropagation(); const p=$('#mExportPop'), open=!p.classList.contains('open'); setSheet(null); if (open){ p.classList.add('open'); closePops(p); } });
  $('#mProps').addEventListener('click',()=>toggleSheet('right'));
  $('#mLayers').addEventListener('click',()=>toggleSheet('left'));
  $('#mColor').addEventListener('click',()=>{ const b=S.bodies.find(x=>x.id===S.sel?.body)||S.bodies[0]; if (!b) return; if (S.sel?.kind!=='body' || S.sel.body!==b.id){ S.sel={kind:'body',body:b.id}; update({all:true}); } setSheet('right'); $('#b-paper')?.scrollIntoView({block:'center'}); });
  $('#mFs').addEventListener('click',()=>{ setSheet(null); APP().dataset.mfs='1'; });

  const syncCrease=()=>{ $('#mCrease').textContent='折り線：'+(S.crease==='dash'?'破線':'実線'); }; syncCrease();
  $('#mExportPop').addEventListener('click',e=>{ const x=e.target.closest('[data-mx]')?.dataset.mx; if(!x) return;
    if (x==='save'){ closePops(); saveSvg(S.bodies.map(b=>b.id)); }
    if (x==='copy'){ closePops(); copySvg(); }
    if (x==='crease'){ const c=$('#crease'); c.value=S.crease==='dash'?'solid':'dash'; c.dispatchEvent(new Event('change')); syncCrease(); } });
  document.addEventListener('click',e=>{ if (!e.target.closest('.mpop,#mTools,#mExport')) closePops(); });
  // Tapping outside an open window closes it, and that tap does nothing else (no selection, no part grab).
  let outside=null;
  document.addEventListener('pointerdown',e=>{
    outside=null;
    if (!isPhone() || !APP().dataset.msheet || e.target.closest('.left,.right,.mbottom,.mtop,.mpop')) return;
    outside={id:e.pointerId, x:e.clientX, y:e.clientY}; e.stopPropagation();
  },true);

}

    const del=e.target.closest('.tdel');
    if (del?.dataset.delpart){ deletePart(del.dataset.body, del.dataset.delpart); return; }
    if (del?.dataset.delbody){ // boxes take their parts and fitted boxes with them, so ask for a second press
      if (!del.classList.contains('armed')){ del.classList.add('armed'); del.title='もう一度押すと削除'; toast('もう一度押すと、箱と中の部品を削除します'); setTimeout(()=>{ if (del.isConnected) del.classList.remove('armed'); },2500); return; }

    const el=e.target.closest('[data-sel]'); if(el) selectFrom(el); });

    const t=b.dataset.tool;

    setTool(t===TOOL?'':t);
  }));
  $('#fitSheet').addEventListener('click',()=>{ sheetView=null; drawSheet(); });
  document.addEventListener('paste',e=>{
    if (/INPUT|TEXTAREA/.test(document.activeElement?.tagName||'')) return;
    const f=[...(e.clipboardData?.files||[])].find(f=>f.type.startsWith('image/')); if (!f) return;
    e.preventDefault(); placeImageFile(f);
  });
  $('#undo').addEventListener('click',undo); $('#redo').addEventListener('click',redo);
  const fold=$('#fold'); fold.value=S.fold*1000;
  fold.addEventListener('input',()=>{ stopPlay(); S.fold=fold.value/1000; applyFold(S.fold); persist(); });
  document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>animateTo(+b.dataset.go)));
  $('#play').addEventListener('click',()=>{ if(playing){ stopPlay(); return; } animateTo(1, S.fold>=0.999?0:S.fold, 6000); });
  $('#resetView').addEventListener('click',frameCamera);
  $('#saveAll').addEventListener('click',()=>saveSvg(S.bodies.map(b=>b.id)));
  $('#copyAll').addEventListener('click',copySvg);
  document.addEventListener('keydown',e=>{
    const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'');
    if (e.key==='Escape'){ setTool(''); $('#addMenu').open=false; }
    if (typing) return;
    if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); }
    if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); }
    if (e.key.toLowerCase()==='r' && !e.ctrlKey && !e.metaKey && S.sel?.kind==='part'){
      const b=S.bodies.find(x=>x.id===S.sel.body), pt=b?.parts.find(x=>x.id===S.sel.part);
      if (pt && pt.type==='perf'){ e.preventDefault(); remember(true); let a=perfAngle(pt)+(e.shiftKey?-15:15); a=((a+180)%360+360)%360-180; pt.ang=a; delete pt.dir; update({all:true}); }
    }
    if ((e.key==='Delete'||e.key==='Backspace') && S.sel?.kind==='part'){ e.preventDefault(); deletePart(S.sel.body,S.sel.part); }
  });
  bindProps(); bindSheet(); bindPhone(); initGL();
  update({all:true, frame:true});
  if (document.fonts?.ready) document.fonts.ready.then(()=>{ texCache.clear(); update({all:true}); });
}
init();
})();
</script>

</body>
</html>
